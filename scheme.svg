<?xml version="1.0" encoding="UTF-8"?>
<!-- Версия: v1.3 -->
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="580" viewBox="0 0 820 580">
  <defs>
    <style>
      .box { fill: #f0f4f8; stroke: #3b5b7a; stroke-width: 2; rx: 8; }
      .arrow { fill: none; stroke: #3b5b7a; stroke-width: 2; marker-end: url(#arrowhead); }
      .label { font-family: sans-serif; font-size: 13px; fill: #1a2b3c; }
      .title { font-family: sans-serif; font-size: 18px; font-weight: bold; fill: #1a2b3c; }
      .note { font-family: sans-serif; font-size: 12px; fill: #5a6b7c; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b5b7a" />
    </marker>
  </defs>

  <text x="20" y="30" class="title">Схема работы redmine_commenter</text>

  <rect x="20" y="60" width="180" height="50" class="box" />
  <text x="40" y="90" class="label">Запуск скрипта</text>

  <rect x="260" y="60" width="240" height="60" class="box" />
  <text x="280" y="82" class="label">Режим: auto</text>
  <text x="280" y="100" class="label">(проверка порта 9222)</text>

  <rect x="560" y="55" width="240" height="50" class="box" />
  <text x="580" y="78" class="label">attach: подключение к</text>
  <text x="580" y="94" class="label">запущенному браузеру</text>

  <rect x="560" y="140" width="240" height="70" class="box" />
  <text x="580" y="162" class="label">launch: запуск с</text>
  <text x="580" y="178" class="label">выделенным профилем</text>
  <text x="580" y="196" class="label">browser_profile/</text>

  <rect x="260" y="230" width="240" height="50" class="box" />
  <text x="280" y="260" class="label">Открыть issue_url</text>

  <rect x="260" y="310" width="240" height="50" class="box" />
  <text x="280" y="340" class="label">Показать форму #update</text>

  <rect x="260" y="390" width="240" height="60" class="box" />
  <text x="280" y="413" class="label">Ввести текст,</text>
  <text x="280" y="430" class="label">нажать «Отправить»</text>

  <rect x="260" y="490" width="240" height="50" class="box" />
  <text x="280" y="520" class="label">Проверить появление</text>

  <line x1="200" y1="85" x2="260" y2="85" class="arrow" />
  <line x1="500" y1="80" x2="560" y2="80" class="arrow" />
  <line x1="500" y1="100" x2="560" y2="165" class="arrow" />
  <text x="505" y="75" class="note">да</text>
  <text x="505" y="130" class="note">нет</text>
  <line x1="380" y1="120" x2="380" y2="230" class="arrow" />
  <line x1="380" y1="280" x2="380" y2="310" class="arrow" />
  <line x1="380" y1="360" x2="380" y2="390" class="arrow" />
  <line x1="380" y1="450" x2="380" y2="490" class="arrow" />

  <text x="20" y="180" class="note">Первый запуск с</text>
  <text x="20" y="196" class="note">выделенным профилем:</text>
  <text x="20" y="212" class="note">однократно выполнить</text>
  <text x="20" y="228" class="note">--login, войти в Redmine</text>
  <text x="20" y="244" class="note">и закрыть окно.</text>
</svg>