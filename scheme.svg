<?xml version="1.0" encoding="UTF-8"?>
<!-- Версия: v1.5 -->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1020" viewBox="0 0 960 1020">
  <defs>
    <style>
      .box { fill: #f0f4f8; stroke: #3b5b7a; stroke-width: 2; rx: 8; }
      .box-err { fill: #fbe9e7; stroke: #a13a2a; stroke-width: 2; rx: 8; }
      .box-end { fill: #e8f3e8; stroke: #2f6b3a; stroke-width: 2; rx: 8; }
      .box-cli { fill: #f6f0fb; stroke: #5f3b7a; stroke-width: 2; rx: 8; }
      .arrow { fill: none; stroke: #3b5b7a; stroke-width: 2; marker-end: url(#arrowhead); }
      .arrow-err { fill: none; stroke: #a13a2a; stroke-width: 2; marker-end: url(#arrowhead-err); stroke-dasharray: 5 4; }
      .arrow-cli { fill: none; stroke: #5f3b7a; stroke-width: 2; marker-end: url(#arrowhead-cli); }
      .label { font-family: sans-serif; font-size: 13px; fill: #1a2b3c; }
      .label-err { font-family: sans-serif; font-size: 12px; fill: #a13a2a; }
      .label-cli { font-family: sans-serif; font-size: 12px; fill: #5f3b7a; }
      .title { font-family: sans-serif; font-size: 18px; font-weight: bold; fill: #1a2b3c; }
      .note { font-family: sans-serif; font-size: 12px; fill: #5a6b7c; }
      .group { fill: none; stroke: #7a8fa6; stroke-width: 1.5; stroke-dasharray: 6 4; rx: 10; }
      .group-label { font-family: sans-serif; font-size: 12px; font-style: italic; fill: #5a6b7c; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b5b7a" />
    </marker>
    <marker id="arrowhead-err" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a13a2a" />
    </marker>
    <marker id="arrowhead-cli" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5f3b7a" />
    </marker>
  </defs>

  <text x="20" y="30" class="title">Схема работы redmine_commenter</text>

  <!-- Запуск и разбор аргументов -->
  <rect x="20" y="60" width="180" height="50" class="box" />
  <text x="40" y="90" class="label">Запуск скрипта</text>

  <rect x="240" y="60" width="200" height="50" class="box" />
  <text x="260" y="90" class="label">Разбор аргументов</text>

  <!-- CLI-ветки -->
  <rect x="520" y="40" width="380" height="40" class="box-cli" />
  <text x="540" y="65" class="label-cli">--login → вход в Redmine, выход</text>

  <rect x="520" y="90" width="380" height="40" class="box-cli" />
  <text x="540" y="115" class="label-cli">--prepare NAME → запустить один парсер, выход</text>

  <rect x="520" y="140" width="380" height="40" class="box-cli" />
  <text x="540" y="165" class="label-cli">--prepare-all → запустить все [prepare:*], выход</text>

  <!-- Валидация конфига -->
  <rect x="240" y="230" width="260" height="70" class="box" />
  <text x="260" y="252" class="label">Валидация конфига:</text>
  <text x="260" y="270" class="label">задачи, issue_url,</text>
  <text x="260" y="288" class="label">файлы, ссылки на [prepare:*]</text>

  <rect x="620" y="230" width="300" height="70" class="box-err" />
  <text x="640" y="252" class="label-err">Ошибка конфига</text>
  <text x="640" y="270" class="label-err">Браузер не открывается,</text>
  <text x="640" y="288" class="label-err">код выхода 1</text>

  <!-- prepare_all? -->
  <rect x="240" y="340" width="260" height="60" class="box" />
  <text x="260" y="364" class="label">prepare_all = true?</text>
  <text x="260" y="382" class="label">(в секции [redmine])</text>

  <rect x="620" y="340" width="300" height="60" class="box" />
  <text x="640" y="364" class="label">Запустить все парсеры,</text>
  <text x="640" y="382" class="label">на которые ссылаются задачи</text>

  <!-- Режим браузера -->
  <rect x="240" y="440" width="260" height="60" class="box" />
  <text x="260" y="464" class="label">Режим auto:</text>
  <text x="260" y="482" class="label">порт 9222 отвечает как DevTools?</text>

  <rect x="620" y="435" width="300" height="40" class="box" />
  <text x="640" y="460" class="label">attach: подключение</text>

  <rect x="620" y="485" width="300" height="50" class="box" />
  <text x="640" y="510" class="label">launch: выделенный профиль</text>

  <!-- Группа: цикл по задачам -->
  <rect x="20" y="550" width="560" height="440" class="group" />
  <text x="40" y="572" class="group-label">Цикл по задачам из секций [task:*] (в порядке файла)</text>

  <rect x="40" y="590" width="520" height="50" class="box" />
  <text x="60" y="620" class="label">Взять следующую задачу [task:&lt;метка&gt;]</text>

  <rect x="40" y="670" width="520" height="60" class="box" />
  <text x="60" y="693" class="label">Если prepare_all = false: запустить</text>
  <text x="60" y="711" class="label">prepare-парсеры задачи (с кэшем на прогон)</text>

  <rect x="40" y="760" width="520" height="50" class="box" />
  <text x="60" y="790" class="label">Открыть issue_url</text>

  <rect x="40" y="840" width="520" height="50" class="box" />
  <text x="60" y="870" class="label">Показать #update, ввести текст, «Отправить»</text>

  <rect x="40" y="920" width="520" height="50" class="box" />
  <text x="60" y="950" class="label">Проверить появление текста в #history</text>

  <!-- Пауза / следующая задача -->
  <rect x="620" y="590" width="300" height="60" class="box" />
  <text x="640" y="614" class="label">Ещё задачи?</text>
  <text x="640" y="632" class="label">пауза task_pause, далее</text>

  <!-- Финальная сводка -->
  <rect x="620" y="760" width="300" height="90" class="box-end" />
  <text x="640" y="782" class="label">Сводка:</text>
  <text x="640" y="800" class="label">обработано / успешно /</text>
  <text x="640" y="818" class="label">с ошибкой</text>
  <text x="640" y="838" class="label">Код 1, если были ошибки</text>

  <!-- Стрелки основного потока -->
  <line x1="200" y1="85" x2="240" y2="85" class="arrow" />
  <line x1="440" y1="85" x2="520" y2="60" class="arrow-cli" />
  <line x1="440" y1="85" x2="520" y2="110" class="arrow-cli" />
  <line x1="440" y1="85" x2="520" y2="160" class="arrow-cli" />
  <line x1="440" y1="85" x2="370" y2="230" class="arrow" />

  <line x1="500" y1="265" x2="620" y2="265" class="arrow-err" />
  <line x1="370" y1="300" x2="370" y2="340" class="arrow" />
  <line x1="500" y1="370" x2="620" y2="370" class="arrow" />
  <line x1="370" y1="400" x2="370" y2="440" class="arrow" />
  <line x1="500" y1="455" x2="620" y2="455" class="arrow" />
  <line x1="500" y1="485" x2="620" y2="510" class="arrow" />
  <line x1="370" y1="500" x2="370" y2="590" class="arrow" />

  <!-- Стрелки в цикле -->
  <line x1="300" y1="640" x2="300" y2="670" class="arrow" />
  <line x1="300" y1="730" x2="300" y2="760" class="arrow" />
  <line x1="300" y1="810" x2="300" y2="840" class="arrow" />
  <line x1="300" y1="890" x2="300" y2="920" class="arrow" />
  <line x1="560" y1="945" x2="620" y2="945" class="arrow" />
  <line x1="620" y1="945" x2="620" y2="650" class="arrow" />
  <line x1="770" y1="650" x2="770" y2="760" class="arrow" />

  <!-- Примечания -->
  <text x="20" y="140" class="note">Первый запуск:</text>
  <text x="20" y="156" class="note">--login, войти в Redmine</text>
  <text x="20" y="172" class="note">и закрыть окно.</text>
  <text x="20" y="200" class="note">--prepare / --prepare-all:</text>
  <text x="20" y="216" class="note">тестирование парсеров</text>
  <text x="20" y="232" class="note">без отправки комментариев.</text>
  <text x="620" y="560" class="note">Упавший парсер: задача пропускается,</text>
  <text x="620" y="576" class="note">остальные обрабатываются.</text>
</svg>