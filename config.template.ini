# Шаблон конфига redmine_commenter v2.13
# Все параметры обезличены. Замените заглушки на свои значения.
# 
# ВАЖНО: Скопируйте этот файл в config.ini и заполните своими данными.
# Не коммитьте config.ini в репозиторий (он добавлен в .gitignore).
#
# Локальные файлы (создаются пользователем или парсерами, не входят в проект):
#   - тексты комментариев (например, comment.txt) — вы создаёте их сами;
#   - результаты парсеров (например, rutube_links.txt) — создаются при запуске парсера.
# Эти файлы не публикуются вместе с проектом.

[redmine]
# Глобальные параметры — одинаковы для всех задач.

# Таймаут ожидания элементов на странице, секунды. Подобрано эмпирически.
timeout = 15

# Пауза после нажатия кнопки отправки, секунды. Подобрано эмпирически.
wait_after_submit = 3

# Пауза между задачами, секунды. Подобрано эмпирически.
task_pause = 2

# Максимальная длина одного комментария в символах.
# Redmine (MySQL/TEXT) по умолчанию ограничивает поле notes 65535 символами.
# Кроме того, send_keys для очень длинных текстов работает крайне медленно.
# Текст длиннее этого значения будет разбит на несколько комментариев.
max_comment_length = 50000

# Если true — все парсеры, на которые ссылаются задачи, запускаются
# до цикла (один раз). Если false — парсеры запускаются по мере
# необходимости перед каждой задачей (с кэшем на прогон).
prepare_all = false

# ID поля для ввода комментария (стандартное для Redmine).
notes_field_id = issue_notes

# Атрибут name кнопки отправки (стандартное для Redmine).
submit_button_name = commit

# URL для режима --login (необязательно). Если пусто — пустая вкладка.
login_url = https://redmine.example.com/

[browser]
# Режим работы:
#   auto   — (рекомендуется) если порт отладки отвечает как Chrome DevTools —
#            подключается к нему; иначе запускает выделенный экземпляр с profile_dir.
#   attach — только подключение к уже запущенному браузеру (без автозапуска).
#   launch — только запуск выделенного экземпляра.
mode = auto

# Порт отладочного протокола.
debugger_port = 9222

# Путь к исполняемому файлу браузера.
# Chromium (Astra Linux) — /usr/bin/chromium.
# Яндекс.Браузер — /usr/bin/yandex-browser.
# Google Chrome — /usr/bin/google-chrome.
browser_binary = /usr/bin/chromium

# Каталог выделенного профиля скрипта. Не совпадает с профилем основного браузера.
profile_dir = ./browser_profile

# Запускать без графического интерфейса (только для launch). По умолчанию False.
headless = False

# Закрывать браузер после работы (только если его запустил сам скрипт).
close_after = false

# Дополнительные аргументы Chromium при запуске в режиме --login.
# Пример: login_extra_args = --no-sandbox
login_extra_args =

# Путь к драйверу (опционально). Если пусто — ищем chromedriver/yandexdriver
# в папке скрипта, затем Selenium Manager.
driver_path =

# --- Парсеры подготовки ---
[prepare:rutube]
script = rutube_parser.py
args =
timeout = 600

# --- Парсер: Rutube ---
[rutube]
channel_url = https://rutube.ru/u/example_channel/
# Файл результата создаётся парсером локально; в проект не входит.
# Содержимое файла — таблица в формате Textile для Redmine.
# Файл имеет структуру:
#   1) таблица, подготовленная к отправке (pending);
#   2) разделитель "--- SENT ---";
#   3) ранее отправленные комментарии (sent).
# Новые ссылки добавляются в pending. После успешной отправки
# redmine_commenter.py перемещает pending под разделитель.
# В комментарий Redmine отправляется только таблица (до разделителя).
output_file = rutube_links.txt
# Пауза между прокрутками страницы, секунды.
scroll_pause = 2
# Максимальное число прокруток (предохранитель от бесконечного цикла).
max_scrolls = 200
# Ограничение количества НОВЫХ записей, добавляемых за один прогон (видео + Shorts).
# Старые записи (pending и sent) сохраняются и не удаляются.
# Пустое значение — добавлять все новые.
# Если sort_by_date = true, лимит применяется к новым записям ПОСЛЕ их сортировки
# (чтобы добавить самые новые из новых).
# Если sort_by_date = false, сбор новых останавливается при достижении лимита.
max_items =
# Ограничение общего времени работы парсера в секундах (0 — без ограничений).
# Если сбор затягивается, парсер остановится и сохранит то, что успел собрать.
# Полезно при работе по cron, чтобы не блокировать следующие задачи.
max_duration = 0
# Сортировать таблицу pending по дате публикации (самые новые сверху).
# true  — pending сортируется по дате, полученной через API Rutube.
# false — pending сохраняет порядок: старые pending, затем новые в порядке сбора.
# На часть sent сортировка не влияет.
sort_by_date = true

# --- Задачи ---
# Каждая задача — отдельная секция [task:<метка>]. Метка произвольная,
# используется только в логах. Порядок секций = порядок обработки.
#
# Параметры задачи:
#   issue_url     — URL страницы задачи (обязательно).
#   prepare       — список парсеров через запятую (см. [prepare:*]).
#   comment_files — один или несколько путей (UTF-8) через продолжение
#                   строки с отступом; содержимое объединяется через
#                   пустую строку. Приоритет над comment_text.
#                   Файлы создаются локально пользователем (или парсерами).
#                   Если файл содержит разделитель "--- SENT ---",
#                   для отправки берётся ТОЛЬКО часть до него (таблица pending).
#   comment_text  — короткий inline-текст.

# Текущая задача: отправка локального comment.txt
[task:7071]
issue_url = https://redmine.example.com/issues/7071
comment_files = comment.txt

# Пример: задача с Rutube-ссылками (раскомментируйте и настройте).
# [task:rutube]
# issue_url = https://redmine.example.com/issues/7071
# prepare = rutube
# comment_files = comment_rutube_intro.txt
#     rutube_links.txt

# Пример: задача с остальными соцсетями (потребует парсеров из будущих этапов).
# [task:social]
# issue_url = https://redmine.example.com/issues/7072
# prepare = telegram, max, vk, dzen, ok
# comment_files = comment_social_intro.txt
#     telegram_links.txt
#     max_links.txt
#     vk_links.txt
#     dzen_links.txt
#     ok_links.txt