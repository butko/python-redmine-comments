# Конфиг redmine_commenter v1.7
# Все параметры обезличены. Замените заглушки на свои значения.

[redmine]
# URL страницы задачи, к которой добавляется комментарий.
issue_url = https://redmine.example.com/issues/123

# --- Текст комментария ---
# Есть два взаимоисключающих способа задать текст. Приоритет: comment_file,
# если он непустой; иначе comment_text.
#
# 1) comment_file — путь к текстовому файлу с комментарием (UTF-8).
#    Рекомендуется для многострочного текста: пустые строки, списки,
#    markdown-разметка сохраняются как есть, без правок.
#    Относительный путь считается от папки скрипта.
comment_file = comment.txt
#
# 2) comment_text — короткий текст inline. Для многострочного текста
#    используйте продолжение строки с отступом (4 пробела), но пустые
#    строки в таком тексте сохранить сложно — редакторы их вычищают.
#    Символ \n НЕ разворачивается в перевод строки.
comment_text =

# Таймаут ожидания элементов на странице, секунды. Подобрано эмпирически.
timeout = 15

# Пауза после нажатия кнопки отправки, секунды. Подобрано эмпирически.
wait_after_submit = 3

# ID поля для ввода комментария (стандартное для Redmine).
notes_field_id = issue_notes

# Атрибут name кнопки отправки (стандартное для Redmine).
submit_button_name = commit

[browser]
# Режим работы:
#   auto   — (рекомендуется) если порт отладки отвечает как Chrome DevTools —
#            подключается к нему; иначе запускает выделенный экземпляр с profile_dir.
#   attach — только подключение к уже запущенному браузеру (без автозапуска).
#   launch — только запуск выделенного экземпляра.
mode = auto

# Порт отладочного протокола.
debugger_port = 9222

# Путь к исполняемому файлу браузера.
# Chromium (Astra Linux) — /usr/bin/chromium.
# Яндекс.Браузер — /usr/bin/yandex-browser.
# Google Chrome — /usr/bin/google-chrome.
browser_binary = /usr/bin/chromium

# Каталог выделенного профиля скрипта. Не совпадает с профилем основного браузера.
# Относительный путь считается от папки скрипта.
# Первый раз нужно войти в Redmine в этом профиле: python3 redmine_commenter.py --login
profile_dir = ./browser_profile

# Запускать без графического интерфейса (только для launch). По умолчанию False.
headless = False

# Закрывать браузер после работы (только если его запустил сам скрипт).
close_after = false

# Дополнительные аргументы Chromium при запуске в режиме --login.
# Пример для Astra Linux, если Chromium падает из-за sandbox:
#   login_extra_args = --no-sandbox
# Пустое значение — без дополнительных аргументов.
login_extra_args =

# Путь к драйверу (опционально). Если пусто — скрипт ищет в своей папке файлы
# chromedriver (приоритет) или yandexdriver. Пример: /usr/local/bin/chromedriver
driver_path =